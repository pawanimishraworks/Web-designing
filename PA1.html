<!--Doctype Html-->
<html>
    <head>
        <title>Image with caption</title>
    </head>
    <body>
    <h1><center><b><font face="aerial" color="blue">
                Famous Monument</font></b></center></h1>
    <figure>
        <center>
       <img src="Tajmahal.png" alt="Taj Mahal, Agra, India" width="400" height="250">
       <figcaption>
        <center>
        Figure 1: The Taj Mahal -Agra, India 
       </figcaption></center>
    </figure>
</body>

</html>
